<!doctype html>
<!-- OG COCO GO (1200x630) · Excel Nivel 1. Golden: chatgpt-intermedio/og.html (FABRICA §6.8).
     Cambiado por curso: --theme (verde Excel #107C41), chip de nivel, logo del producto,
     titulo y bajada. El --theme-light del golden es un claro sobre fondo oscuro: el token
     del curso (#0A5A2E) es la derivada para fondo CLARO y aca no se lee, asi que va #34D07A.
     Render: Chrome headless --screenshot=og.png --window-size=1200,630 file://.../og.html -->
<html lang="es"><head><meta charset="utf-8">
<style>
  :root{--theme:#107C41;--theme-light:#34D07A;--theme-rgb:16,124,65;--ink:#EAF0F7;--bg:#0B0F1A;}
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:
      radial-gradient(1100px 600px at 78% -10%, rgba(var(--theme-rgb),.28), transparent 60%),
      radial-gradient(800px 500px at 0% 120%, rgba(var(--theme-rgb),.10), transparent 55%),
      #0B0F1A;
    color:var(--ink);font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
    padding:74px 84px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
  .top{display:flex;align-items:center;gap:16px}
  .top img{height:46px}
  .chip{display:inline-block;background:rgba(var(--theme-rgb),.16);color:var(--theme-light);
    border:1.5px solid rgba(var(--theme-rgb),.45);border-radius:999px;padding:7px 20px;
    font-size:22px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  h1{font-size:82px;line-height:1.02;font-weight:800;letter-spacing:-.02em;max-width:1000px}
  h1 .grad{color:var(--theme-light)}
  h1 .cl{height:.82em;width:.82em;vertical-align:-.06em;margin-right:.12em}
  .sub{font-size:30px;color:#AEB8C9;margin-top:22px;font-weight:500}
  .foot{display:flex;align-items:center;justify-content:space-between;font-size:24px;color:#8A96B0}
  .foot b{color:var(--ink)}
</style></head>
<body>
  <div class="top"><img src="../assets/logo-coco-go.svg" alt="COCO GO"><span class="chip">Nivel 1</span></div>
  <div>
    <h1><img class="cl" src="../assets/logo-excel.svg" alt="">Excel para tu negocio,<br><span class="grad">· Nivel 1.</span></h1>
    <div class="sub">Una planilla que trabaja para vos: anotás una vez, el número se mueve, la planilla te avisa y el cierre de mes no se rehace a mano.</div>
  </div>
  <div class="foot"><span>Curso interactivo · 6 módulos · un solo libro</span><span><b>cursos.coco-go.lat</b></span></div>
</body></html>
