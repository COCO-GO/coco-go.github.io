<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--theme:#107C41;--theme-light:#34D07A;--theme-rgb:16,124,65;--ink:#EAF0F7;--bg:#0B0F1A;}
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:
      radial-gradient(1100px 600px at 78% -10%, rgba(var(--theme-rgb),.28), transparent 60%),
      radial-gradient(800px 500px at 0% 120%, rgba(var(--theme-rgb),.10), transparent 55%),
      #0B0F1A;
    color:var(--ink);font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
    padding:74px 84px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
  .grid{position:absolute;inset:0;opacity:.14;pointer-events:none;
    background-image:
      linear-gradient(rgba(52,208,122,.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(52,208,122,.35) 1px, transparent 1px);
    background-size:48px 28px;background-position:20px 12px;mask-image:radial-gradient(70% 80% at 82% 42%, #000 20%, transparent 72%)}
  .top{display:flex;align-items:center;gap:16px;position:relative}
  .top img{height:46px}
  .chip{display:inline-block;background:rgba(var(--theme-rgb),.16);color:var(--theme-light);
    border:1.5px solid rgba(var(--theme-rgb),.45);border-radius:999px;padding:7px 20px;
    font-size:22px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  h1{font-size:82px;line-height:1.02;font-weight:800;letter-spacing:-.02em;max-width:1000px;position:relative}
  h1 .grad{color:var(--theme-light)}
  h1 .cl{height:.82em;width:.82em;vertical-align:-.06em;margin-right:.12em}
  .sub{font-size:30px;color:#AEB8C9;margin-top:22px;font-weight:500;font-family:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;max-width:980px;position:relative;line-height:1.32}
  .foot{display:flex;align-items:center;justify-content:space-between;font-size:24px;color:#8A96B0;position:relative;font-family:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif}
  .foot b{color:var(--ink);font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif}
</style></head>
<body>
  <div class="grid"></div>
  <div class="top"><img src="../assets/logo-coco-go.svg" alt="COCO GO"><span class="chip">Nivel 2</span></div>
  <div>
    <h1><img class="cl" src="../assets/logo-excel.svg" alt="">Excel para tu negocio<br><span class="grad">· Nivel 2.</span></h1>
    <div class="sub">La planilla aguanta cuando hay extracto, otro mes y otra persona. Una cuenta corriente: quién debe y desde cuándo.</div>
  </div>
  <div class="foot"><span>Curso interactivo · 6 módulos · un solo libro · Excel web</span><span><b>cursos.coco-go.lat</b></span></div>
</body></html>
